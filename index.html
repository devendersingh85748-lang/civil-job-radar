<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Civil Engg Master Radar — Jobs, Admit Cards & Closed Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-6xl mx-auto">
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-emerald-400 tracking-tight">🏗️ CIVIL ENGG VERIFIED JOB RADAR</h1>
        <p class="text-sm text-slate-400 mt-1">100% Genuine Live Vacancies • Admit Card Radar • 30-Day Closed Tracker (Diploma | B.Tech | M.Tech)</p>
      </div>
      <span id="job-count" class="mt-3 md:mt-0 bg-emerald-950 border border-emerald-700 text-emerald-300 text-xs font-bold px-3.5 py-1.5 rounded-full">
        Loading...
      </span>
    </div>

    <!-- MAIN 3-SECTION SWITCH: ACTIVE vs ADMIT CARDS vs CLOSED -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-2.5 mb-6 bg-slate-900 p-1.5 rounded-2xl border border-slate-800">
      <button onclick="setStatusTab('ACTIVE')" id="status-ACTIVE" 
        class="py-3 px-4 rounded-xl font-extrabold text-xs md:text-sm transition flex items-center justify-center gap-2 bg-emerald-600 text-white shadow-lg">
        <span>🟢 Active Vacancies</span>
        <span id="count-active" class="bg-black/30 px-2 py-0.5 rounded-full text-xs">0</span>
      </button>
      <button onclick="setStatusTab('ADMIT')" id="status-ADMIT" 
        class="py-3 px-4 rounded-xl font-extrabold text-xs md:text-sm transition flex items-center justify-center gap-2 text-slate-400 hover:text-white">
        <span>🎫 Admit Cards & Exam Dates</span>
        <span id="count-admit" class="bg-slate-800 px-2 py-0.5 rounded-full text-xs">0</span>
      </button>
      <button onclick="setStatusTab('CLOSED')" id="status-CLOSED" 
        class="py-3 px-4 rounded-xl font-extrabold text-xs md:text-sm transition flex items-center justify-center gap-2 text-slate-400 hover:text-white">
        <span>🔴 Closed (Last 1 Month)</span>
        <span id="count-closed" class="bg-slate-800 px-2 py-0.5 rounded-full text-xs">0</span>
      </button>
    </div>

    <!-- Search & Sector Filter -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-6">
      <input id="search-input" type="text" oninput="renderJobs()" placeholder="🔍 Search JE, AE, Lecturer, Admit Card, JSSC, SSC, RRB, L&T..." 
        class="md:col-span-2 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
      
      <select id="sector-filter" onchange="renderJobs()" class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
        <option value="ALL">🏛️🏢 All Sectors (Govt + Private)</option>
        <option value="GOVT">🏛️ Only Govt / PSU / Academic</option>
        <option value="PRIVATE">🏢 Only Private MNCs (Design / Site)</option>
      </select>
    </div>

    <!-- Qualification Filter Tabs -->
    <div class="flex flex-wrap gap-2 mb-8">
      <button onclick="setCategory('ALL')" id="tab-ALL" class="tab-btn bg-emerald-600 text-white text-xs md:text-sm font-bold px-4 py-2.5 rounded-xl">📋 All Qualifications</button>
      <button onclick="setCategory('D')" id="tab-D" class="tab-btn bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs md:text-sm font-bold px-4 py-2.5 rounded-xl">👷 Diploma (JE / Technical)</button>
      <button onclick="setCategory('B')" id="tab-B" class="tab-btn bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs md:text-sm font-bold px-4 py-2.5 rounded-xl">🏛️ B.Tech (AE / PSU / Site)</button>
      <button onclick="setCategory('M')" id="tab-M" class="tab-btn bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs md:text-sm font-bold px-4 py-2.5 rounded-xl">🎓 M.Tech (Lecturer / Design / Scientist)</button>
    </div>

    <!-- Cards Grid -->
    <div id="jobs-container" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hnrodyjundgwylskvhbj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_LdGBnlTBOeTRo9bpxnAZ8Q_y67l0BVy';

    let allJobs = [];
    let activeQual = 'ALL';
    let activeStatusTab = 'ACTIVE'; // 'ACTIVE', 'ADMIT', 'CLOSED'

    function parseDateString(dateStr) {
      if (!dateStr || dateStr.includes('PDF') || dateStr.includes('Check') || dateStr.includes('Notice')) return null;
      const dmy = dateStr.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);
      if (dmy) {
        return new Date(parseInt(dmy[3]), parseInt(dmy[2]) - 1, parseInt(dmy[1]), 23, 59, 59);
      }
      const parsed = new Date(dateStr);
      if (!isNaN(parsed.getTime())) {
        parsed.setHours(23, 59, 59);
        return parsed;
      }
      return null;
    }

    function parseJobMeta(job) {
      const parts = (job.category || '').split('|');
      let shortCat = 'B.Tech', header = '🟦 【 🏛️ CIVIL RECRUITMENT 】', quals = 'B', startDate = '', endDate = 'Check Official PDF';

      if (parts.length >= 5) {
        shortCat = parts[0];
        header = parts[1];
        quals = parts[2];
        startDate = parts[3];
        endDate = parts[4];
      } else {
        const c = job.category || '';
        quals = (c.includes('Diploma') ? 'D' : '') + 'B' + (c.includes('M.Tech') ? 'M' : '');
        startDate = new Date(job.created_at).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
      }

      // Check if it's an Admit Card / Exam Date item
      if (shortCat === 'ADMIT_CARD' || header.includes('ADMIT CARD')) {
        return { shortCat, header, quals, startDate, endDate, status: 'ADMIT', daysLeft: null };
      }

      const now = new Date();
      const thirtyDaysAgo = new Date(now.getTime() - (30 * 24 * 60 * 60 * 1000));
      const endObj = parseDateString(endDate);

      let status = 'ACTIVE';
      let daysLeft = null;

      if (endObj) {
        const diffDays = Math.ceil((endObj - now) / (1000 * 60 * 60 * 24));
        daysLeft = diffDays;
        if (endObj < now && endObj >= thirtyDaysAgo) {
          status = 'CLOSED';
        } else if (endObj < thirtyDaysAgo) {
          status = 'ARCHIVED';
        }
      }

      return { shortCat, header, quals, startDate, endDate, status, daysLeft };
    }

    async function fetchJobs() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/civil_jobs?select=*&order=created_at.desc&limit=400`, {
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
      });
      const data = await res.json();
      if (Array.isArray(data)) {
        allJobs = data.map(j => ({ ...j, meta: parseJobMeta(j) })).filter(j => j.meta.status !== 'ARCHIVED');
        renderJobs();
      }
    }

    function setStatusTab(tab) {
      activeStatusTab = tab;
      const baseClass = 'py-3 px-4 rounded-xl font-extrabold text-xs md:text-sm transition flex items-center justify-center gap-2 text-slate-400 hover:text-white';
      
      document.getElementById('status-ACTIVE').className = tab === 'ACTIVE'
        ? 'py-3 px-4 rounded-xl font-extrabold text-xs md:text-sm transition flex items-center justify-center gap-2 bg-emerald-600 text-white shadow-lg'
        : baseClass;

      document.getElementById('status-ADMIT').className = tab === 'ADMIT'
        ? 'py-3 px-4 rounded-xl font-extrabold text-xs md:text-sm transition flex items-center justify-center gap-2 bg-cyan-600 text-white shadow-lg'
        : baseClass;

      document.getElementById('status-CLOSED').className = tab === 'CLOSED'
        ? 'py-3 px-4 rounded-xl font-extrabold text-xs md:text-sm transition flex items-center justify-center gap-2 bg-rose-600 text-white shadow-lg'
        : baseClass;

      renderJobs();
    }

    function setCategory(q) {
      activeQual = q;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = 'tab-btn bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs md:text-sm font-bold px-4 py-2.5 rounded-xl';
      });
      document.getElementById('tab-' + q).className = 'tab-btn bg-emerald-600 text-white text-xs md:text-sm font-bold px-4 py-2.5 rounded-xl';
      renderJobs();
    }

    function renderJobs() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const sector = document.getElementById('sector-filter').value;

      const baseFiltered = allJobs.filter(job => {
        const matchesQual = activeQual === 'ALL' || job.meta.quals.includes(activeQual);
        const matchesSearch = job.title.toLowerCase().includes(search) || job.source.toLowerCase().includes(search) || job.meta.header.toLowerCase().includes(search);
        const isPrivate = job.source.toLowerCase().includes('private') || job.source.toLowerCase().includes('mnc') || job.source.toLowerCase().includes('epc');
        const matchesSector = sector === 'ALL' || (sector === 'PRIVATE' && isPrivate) || (sector === 'GOVT' && !isPrivate);
        return matchesQual && matchesSearch && matchesSector;
      });

      const activeList = baseFiltered.filter(j => j.meta.status === 'ACTIVE');
      const admitList = baseFiltered.filter(j => j.meta.status === 'ADMIT');
      const closedList = baseFiltered.filter(j => j.meta.status === 'CLOSED');

      document.getElementById('count-active').innerText = activeList.length;
      document.getElementById('count-admit').innerText = admitList.length;
      document.getElementById('count-closed').innerText = closedList.length;

      const finalJobs = activeStatusTab === 'ACTIVE' ? activeList : (activeStatusTab === 'ADMIT' ? admitList : closedList);
      document.getElementById('job-count').innerText = activeStatusTab === 'ACTIVE' 
        ? `${finalJobs.length} Active Jobs` 
        : (activeStatusTab === 'ADMIT' ? `${finalJobs.length} Admit Cards & Exam Dates` : `${finalJobs.length} Closed (Last 30 Days)`);

      const container = document.getElementById('jobs-container');
      if (finalJobs.length === 0) {
        container.innerHTML = `<div class="col-span-2 bg-slate-900 border border-slate-800 p-8 rounded-2xl text-center text-slate-400">
          No items in this section matching your filter right now.
        </div>`;
        return;
      }

      container.innerHTML = finalJobs.map(job => {
        const hasD = job.meta.quals.includes('D');
        const hasB = job.meta.quals.includes('B');
        const hasM = job.meta.quals.includes('M');
        const isClosed = job.meta.status === 'CLOSED';
        const isAdmit = job.meta.status === 'ADMIT';
        const isClosingSoon = !isClosed && !isAdmit && job.meta.daysLeft !== null && job.meta.daysLeft >= 0 && job.meta.daysLeft <= 5;

        return `
          <div class="bg-slate-900 rounded-2xl border ${isClosed ? 'border-rose-900/60 opacity-90' : (isAdmit ? 'border-cyan-700/70' : 'border-slate-800')} overflow-hidden shadow-lg flex flex-col justify-between">
            <div>
              <!-- Card Header Banner -->
              <div class="bg-slate-800/90 border-b border-slate-700 px-4 py-2.5 flex justify-between items-center gap-2">
                <span class="text-xs md:text-sm font-extrabold tracking-wide text-white">${job.meta.header}</span>
                <div class="flex items-center gap-1.5 shrink-0">
                  ${isClosed ? `<span class="text-[10px] font-extrabold bg-rose-600 text-white px-2 py-0.5 rounded">🔴 CLOSED</span>` : ''}
                  ${isAdmit ? `<span class="text-[10px] font-extrabold bg-cyan-500 text-slate-950 px-2 py-0.5 rounded">🎫 EXAM UPDATE</span>` : ''}
                  ${isClosingSoon ? `<span class="text-[10px] font-extrabold bg-amber-500 text-black px-2 py-0.5 rounded animate-pulse">⏳ ${job.meta.daysLeft}d LEFT</span>` : ''}
                  <span class="text-[11px] font-semibold bg-slate-950 text-emerald-400 border border-slate-700 px-2.5 py-0.5 rounded-md">${job.source}</span>
                </div>
              </div>

              <!-- Body -->
              <div class="p-4 space-y-4">
                <h2 class="text-base md:text-lg font-bold text-slate-100 leading-snug">📌 ${job.title}</h2>

                <!-- Qualification Highlight Pills -->
                <div>
                  <p class="text-[11px] uppercase tracking-wider text-slate-400 font-bold mb-1.5">🎓 Target Qualifications:</p>
                  <div class="grid grid-cols-3 gap-2">
                    <div class="text-center py-1.5 rounded-lg text-xs font-extrabold border ${hasD ? 'bg-amber-500/20 border-amber-400 text-amber-300' : 'bg-slate-950/40 border-slate-800 text-slate-600'}">
                      ${hasD ? '✅ DIPLOMA' : '⬜ Diploma'}
                    </div>
                    <div class="text-center py-1.5 rounded-lg text-xs font-extrabold border ${hasB ? 'bg-blue-500/20 border-blue-400 text-blue-300' : 'bg-slate-950/40 border-slate-800 text-slate-600'}">
                      ${hasB ? '✅ B.TECH' : '⬜ B.Tech'}
                    </div>
                    <div class="text-center py-1.5 rounded-lg text-xs font-extrabold border ${hasM ? 'bg-purple-500/20 border-purple-400 text-purple-300' : 'bg-slate-950/40 border-slate-800 text-slate-600'}">
                      ${hasM ? '✅ M.TECH' : '⬜ M.Tech'}
                    </div>
                  </div>
                </div>

                <!-- Start Date & End Date Box -->
                <div class="grid grid-cols-2 gap-2 bg-slate-950/80 border border-slate-800 rounded-xl p-2.5 text-xs">
                  <div>
                    <span class="text-slate-400 block text-[11px]">${isAdmit ? '🟢 Notice Released' : '🟢 Start Date'}</span>
                    <span class="font-bold text-emerald-400">${job.meta.startDate}</span>
                  </div>
                  <div class="border-l border-slate-800 pl-3">
                    <span class="text-slate-400 block text-[11px]">${isAdmit ? '🎫 Exam / Schedule' : (isClosed ? '🔴 Closed On' : '🔴 Last Date')}</span>
                    <span class="font-bold ${isClosed ? 'text-rose-500 line-through' : (isAdmit ? 'text-cyan-400' : 'text-rose-400')}">${job.meta.endDate}</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- Card Footer Button -->
            <div class="p-3 bg-slate-950/50 border-t border-slate-800/80">
              <a href="${job.link}" target="_blank" rel="noopener noreferrer" 
                 class="block w-full ${isClosed ? 'bg-slate-800 hover:bg-slate-700 text-slate-200' : (isAdmit ? 'bg-cyan-500 hover:bg-cyan-400 text-slate-950' : 'bg-emerald-500 hover:bg-emerald-400 text-slate-950')} font-extrabold text-xs md:text-sm py-2.5 rounded-xl text-center transition">
                ${isClosed ? '📄 View Closed Notification PDF ↗' : (isAdmit ? '🎫 Download Admit Card / View Exam Schedule ↗' : '📄 View Official Notification / Apply Now ↗')}
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    fetchJobs();
  </script>
</body>
</html>
