<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Civil Engg Master Job Portal (Diploma | B.Tech | M.Tech)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-5xl mx-auto">
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-emerald-400">🏗️ Civil Engineering Verified Job Radar</h1>
        <p class="text-sm text-slate-400 mt-1">Live Automated Feed • Central/State Govt (JE/AE/Lecturer) • PSUs • Top Design & EPC MNCs</p>
      </div>
      <span id="job-count" class="mt-3 md:mt-0 bg-emerald-950 border border-emerald-700 text-emerald-300 text-xs font-semibold px-3 py-1.5 rounded-full">
        Loading jobs...
      </span>
    </div>

    <!-- Search & Qualification Filters -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-6">
      <input id="search-input" type="text" oninput="renderJobs()" placeholder="Search JSSC, SSC, Lecturer, Structural, L&T, Gurugram..." 
        class="md:col-span-2 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
      
      <select id="sector-filter" onchange="renderJobs()" class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
        <option value="ALL">🏛️🏢 All Sectors (Govt + Private)</option>
        <option value="GOVT">🏛️ Only Govt / PSU / Academic</option>
        <option value="PRIVATE">🏢 Only Private MNCs (Design / Site)</option>
      </select>
    </div>

    <!-- Qualification Tabs -->
    <div class="flex flex-wrap gap-2 mb-6">
      <button onclick="setCategory('ALL')" id="tab-ALL" class="tab-btn bg-emerald-600 text-white text-xs md:text-sm font-medium px-4 py-2 rounded-lg">All Qualifications</button>
      <button onclick="setCategory('Diploma')" id="tab-Diploma" class="tab-btn bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs md:text-sm font-medium px-4 py-2 rounded-lg">🎓 Diploma (JE / Supervisor)</button>
      <button onclick="setCategory('B.Tech')" id="tab-B.Tech" class="tab-btn bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs md:text-sm font-medium px-4 py-2 rounded-lg">🎓 B.Tech (AE / PSU / Site & Billing)</button>
      <button onclick="setCategory('M.Tech')" id="tab-M.Tech" class="tab-btn bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs md:text-sm font-medium px-4 py-2 rounded-lg">🎓 M.Tech (Lecturer / Structural / Scientist)</button>
    </div>

    <!-- Jobs List -->
    <div id="jobs-container" class="space-y-3"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hnrodyjundgwylskvhbj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_LdGBnlTBOeTRo9bpxnAZ8Q_y67l0BVy';

    let allJobs = [];
    let activeCategory = 'ALL';

    async function fetchJobs() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/civil_jobs?select=*&order=created_at.desc&limit=300`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });
        const data = await res.json();
        if (Array.isArray(data)) {
          allJobs = data;
          renderJobs();
        }
      } catch (err) {
        console.error('Error loading jobs:', err);
      }
    }

    function setCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = 'tab-btn bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs md:text-sm font-medium px-4 py-2 rounded-lg';
      });
      document.getElementById('tab-' + cat).className = 'tab-btn bg-emerald-600 text-white text-xs md:text-sm font-medium px-4 py-2 rounded-lg';
      renderJobs();
    }

    function renderJobs() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const sector = document.getElementById('sector-filter').value;

      const filtered = allJobs.filter(job => {
        const matchesCat = activeCategory === 'ALL' || job.category.includes(activeCategory);
        const matchesSearch = job.title.toLowerCase().includes(search) || job.source.toLowerCase().includes(search);
        const isPrivate = job.source.includes('Private') || job.source.includes('MNC') || job.source.includes('EPC');
        const matchesSector = sector === 'ALL' || (sector === 'PRIVATE' && isPrivate) || (sector === 'GOVT' && !isPrivate);
        return matchesCat && matchesSearch && matchesSector;
      });

      document.getElementById('job-count').innerText = `${filtered.length} Verified Jobs Found`;

      const container = document.getElementById('jobs-container');
      if (filtered.length === 0) {
        container.innerHTML = `<div class="bg-slate-900 border border-slate-800 p-8 rounded-lg text-center text-slate-400">No jobs matching current filter yet. Run the GitHub Action once to populate live jobs!</div>`;
        return;
      }

      container.innerHTML = filtered.map(job => {
        const dateStr = new Date(job.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
        return `
          <div class="bg-slate-900 hover:bg-slate-800/80 transition p-4 rounded-xl border border-slate-800 flex flex-col md:flex-row justify-between md:items-center gap-4">
            <div class="space-y-1.5">
              <div class="flex flex-wrap items-center gap-2">
                <span class="text-xs font-semibold bg-emerald-950 text-emerald-300 border border-emerald-800 px-2.5 py-0.5 rounded">${job.category}</span>
                <span class="text-xs font-medium bg-blue-950 text-blue-300 border border-blue-800 px-2.5 py-0.5 rounded">${job.source}</span>
                <span class="text-xs text-slate-400">📅 ${dateStr}</span>
              </div>
              <h2 class="text-base md:text-lg font-semibold text-slate-100">${job.title}</h2>
            </div>
            <a href="${job.link}" target="_blank" rel="noopener noreferrer" 
               class="shrink-0 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs md:text-sm px-4 py-2.5 rounded-lg text-center">
              Official Notice / Apply ↗
            </a>
          </div>
        `;
      }).join('');
    }

    fetchJobs();
  </script>
</body>
</html>
